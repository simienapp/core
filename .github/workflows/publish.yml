name: Publish crates

# Manual: publishes every crate version crates.io doesn't have yet
# (tools/publish.py). Rerunning is safe. Authenticates with crates.io trusted
# publishing: each crate trusts simienapp/core, this file and the release
# environment, and the short-lived token is revoked when the job ends. A
# brand-new crate can't be published this way: its first version uses the
# release environment's CARGO_REGISTRY_TOKEN secret (tools/publish.py), and
# from then on the crate trusts this workflow. Without new crates the secret
# is never read and can be deleted.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          NEW_CRATE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/publish.py
