[package]
name = "simien_signals"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Signal handling for simien_net and the Node layer. Forked from deno_signals 0.50.0."

[lib]
path = "lib.rs"

[dependencies]
libc.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
