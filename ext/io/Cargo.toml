[package]
name = "simien_io"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Standard streams and resources for Simien's Node layer. Forked from deno_io 0.169.0."

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
simien_core.workspace = true
simien_error.workspace = true
simien_permissions.workspace = true
filetime.workspace = true
log.workspace = true
pin-project.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(windows))'.dependencies]
os_pipe.workspace = true
libc.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user", "socket"] }

[target.'cfg(windows)'.dependencies]
rand.workspace = true
parking_lot.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Console"] }
simien_subprocess_windows.workspace = true
libc.workspace = true
