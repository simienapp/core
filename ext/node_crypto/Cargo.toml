[package]
name = "simien_node_crypto"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
repository = "https://github.com/simienapp/core"
description = "node:crypto's native parts for simien_node. Forked from deno_node_crypto 0.29.0."

[lib]
path = "lib.rs"

[dependencies]
aead-gcm-stream.workspace = true
aes.workspace = true
aws-lc-rs.workspace = true
aws-lc-sys.workspace = true
base64.workspace = true
blake2.workspace = true
cbc.workspace = true
const-oid.workspace = true
ctr.workspace = true
data-encoding.workspace = true
simien_core.workspace = true
simien_crypto_provider.workspace = true
simien_error.workspace = true
der = { workspace = true, features = ["derive"] }
des.workspace = true
digest = { workspace = true, features = ["core-api", "std"] }
dsa.workspace = true
ecb.workspace = true
ecdsa.workspace = true
ed25519-dalek = { workspace = true, features = ["digest", "pkcs8", "rand_core", "signature"] }
ed448-goldilocks = { workspace = true }
elliptic-curve.workspace = true
faster-hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
k256.workspace = true
md-5 = { workspace = true, features = ["oid"] }
md4.workspace = true
num-bigint = { workspace = true, features = ["rand"] }
num-bigint-dig.workspace = true
num-integer.workspace = true
num-traits.workspace = true
p12.workspace = true
p224.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
pbkdf2.workspace = true
pkcs8 = { workspace = true, features = ["std", "pkcs5", "encryption"] }
rand.workspace = true
ripemd = { workspace = true, features = ["oid"] }
rsa.workspace = true
sec1.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3 = { workspace = true, features = ["oid"] }
sm3.workspace = true
spki.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
x509-parser.workspace = true
yasna = { version = "0.5", features = ["std"] }
yoke.workspace = true
