[package]
name = "simien_web"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Web APIs for the Simien runtime: streams, encoding, URL, events, timers, Blob and more (WinterTC). Forked from Deno's deno_web 0.290.0."

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
brotli.workspace = true
bytes.workspace = true
simien_core.workspace = true
simien_error.workspace = true
encoding_rs.workspace = true
flate2 = { workspace = true, features = ["default"] }
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true
urlpattern.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
approx = "0.5.1"
simien_bench_util.workspace = true
simien_webidl.workspace = true

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "timers_ops"
harness = false

[[bench]]
name = "url_ops"
harness = false

[[bench]]
name = "text_decoder_stream"
harness = false
