[package]
name = "simien_os"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "OS information and signals for Simien's Node layer. Forked from deno_os 0.76.0."

[lib]
path = "lib.rs"

[dependencies]
simien_core.workspace = true
simien_error.workspace = true
simien_path_util.workspace = true
simien_permissions.workspace = true
simien_signals.workspace = true
libc.workspace = true
netif.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }
