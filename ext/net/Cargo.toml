[package]
name = "simien_net"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Networking for Simien: the TCP, TLS and Unix stream types its HTTP server and WebSocket run on, and the sockets, DNS, UDP and QUIC that its Node layer (simien_node) uses. Forked from deno_net 0.251.0."

[lib]
path = "lib.rs"

[dependencies]
simien_core.workspace = true
simien_error.workspace = true
simien_features.workspace = true
simien_permissions.workspace = true
simien_signals.workspace = true
simien_tls.workspace = true
hickory-proto.workspace = true
hickory-resolver.workspace = true
libc.workspace = true
log.workspace = true
pin-project.workspace = true
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls-tokio-stream.workspace = true
serde.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
web-transport-proto.workspace = true
x509-parser.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
tokio-vsock.workspace = true

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["real", "libc"] }
