[package]
name = "simien_node"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Node's APIs for Simien, for code granted dangerouslyUseNode (APS 2). Forked from deno_node 0.197.0."

[lib]
path = "lib.rs"

[features]
sync_fs = ["simien_fs/sync_fs", "simien_package_json/sync", "simien_node_resolver/sync"]

[dependencies]
base64.workspace = true
simien_boxed_error.workspace = true
brotli.workspace = true
bytes.workspace = true
deno_ast = { workspace = true, features = ["type_strip"] }
simien_core.workspace = true
simien_dotenv.workspace = true
simien_error.workspace = true
simien_fs.workspace = true
simien_inspector_server.workspace = true
simien_io.workspace = true
simien_native_certs.workspace = true
simien_net.workspace = true
simien_node_crypto.workspace = true
simien_os.workspace = true
simien_package_json.workspace = true
simien_path_util.workspace = true
simien_permissions.workspace = true
simien_process.workspace = true
simien_resolver.workspace = true
simien_tls.workspace = true
deno_whoami.workspace = true
filetime.workspace = true
hdrhistogram.workspace = true
idna.workspace = true
ipnet.workspace = true
libc.workspace = true
libnghttp2 = "1.68.0"
libz-sys.workspace = true
log.workspace = true
simien_node_resolver.workspace = true
simien_node_shim.workspace = true
rand.workspace = true
rustls-tokio-stream.workspace = true
rustls-webpki.workspace = true
serde.workspace = true
smallvec.workspace = true
socket2.workspace = true
simien_sys_traits = { workspace = true, features = ["real", "winapi", "libc"] }
thiserror.workspace = true
tokio.workspace = true
tokio-eld.workspace = true
url.workspace = true
webpki-root-certs.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
errno = "0.3.10"
nix = { workspace = true, features = ["user"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
deno_subprocess_windows.workspace = true
