[package]
name = "simien_unsync"
version = "0.1.1"
edition = "2021"
authors = ["the Deno authors", "the Simien authors"]
license = "MIT"
repository = "https://github.com/simienapp/core"
description = "Adapters for working with Tokio on a single thread. Forked from Deno's simien_unsync 0.4.4."
readme = "README.md"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
futures-util = { version = "0.3.21", default-features = false, features = ["std"] }
parking_lot = "0.12.3"
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[lib]
name = "simien_unsync"
