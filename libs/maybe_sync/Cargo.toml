[package]
name = "simien_maybe_sync"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Rc or Arc depending on a feature, for Simien. Forked from deno_maybe_sync 0.46.0."
edition.workspace = true
license = "MIT"

[lib]
path = "lib.rs"

[features]
sync = ["dashmap"]

[dependencies]
dashmap = { workspace = true, optional = true }
rustc-hash.workspace = true
