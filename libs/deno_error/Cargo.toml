[package]
name = "simien_error"
version = "0.1.1"
description = "Error representation to JavaScript for simien_core. Forked from Deno's deno_error 0.7.1."
repository = "https://github.com/simienapp/core"
documentation = "https://docs.rs/deno_error"
authors = ["the Deno authors", "the Simien authors"]
edition = "2021"
license = "MIT"

[dependencies]
simien_error_macro = { version = "=0.1.1", path = "macros" }
libc = "0.2.126"

tokio = { version = "1", features = ["full"], optional = true }
url = { version = "2", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
thiserror = "2"
