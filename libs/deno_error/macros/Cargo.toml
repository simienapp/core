[package]
name = "simien_error_macro"
version = "0.1.0"
description = "Macro for writing simien_error errors. Forked from Deno's deno_error_macro 0.7.1."
repository = "https://github.com/simienapp/core"
documentation = "https://docs.rs/deno_error"
authors = ["the Deno authors", "the Simien authors"]
edition = "2021"
license = "MIT"

[lib]
path = "./lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
