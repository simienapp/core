[package]
name = "simien_serde_v8"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Rust to V8 serialization and deserialization. Forked from Deno's serde_v8 0.321.0."

[lib]
path = "lib.rs"

[features]
default = ["v8"]
quickjs = ["v8/quickjs", "simien_serde_v8_utilities/quickjs"]
v8 = ["v8/v8", "simien_serde_v8_utilities/v8"]

[dependencies]
simien_error.workspace = true
num-bigint.workspace = true
serde.workspace = true
smallvec = { workspace = true, features = ["union"] }
thiserror.workspace = true
v8.workspace = true

[dev-dependencies]
serde_bytes.workspace = true
serde_json.workspace = true
simien_serde_v8_utilities = { path = "./utilities", default-features = false }

[[example]]
name = "basic"
