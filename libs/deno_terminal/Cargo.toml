[package]
name = "simien_terminal"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Terminal colours and helpers, for Simien. Forked from deno_terminal 0.2.3."
edition = "2021"
license = "MIT"

[features]
default = ["colors"]
colors = ["termcolor"]

[dependencies]
once_cell = "1.17.1"
termcolor = { version = "1.1.3", optional = true }

[dev-dependencies]
pretty_assertions = "1.0.0"
