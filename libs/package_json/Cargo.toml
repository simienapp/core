# Copyright 2018-2026 the Deno authors. MIT license.
[package]
name = "simien_package_json"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "package.json parsing for Simien. Forked from deno_package_json 0.61.0."
edition.workspace = true
license = "MIT"

[lib]
path = "lib.rs"

[features]
sync = ["simien_maybe_sync/sync"]

[dependencies]
simien_boxed_error.workspace = true
simien_capacity_builder.workspace = true
simien_error = { workspace = true, features = ["serde", "serde_json"] }
simien_maybe_sync.workspace = true
simien_path_util.workspace = true
simien_semver.workspace = true
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
