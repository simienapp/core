[package]
name = "simien_npm_installer"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Installs npm packages into node_modules for Simien. Forked from deno_npm_installer 0.54.0."
edition.workspace = true
license = "MIT"
readme = "README.md"

[lib]
path = "lib.rs"

[dependencies]
anyhow.workspace = true
async-once-cell.workspace = true
async-trait.workspace = true
bincode.workspace = true
simien_boxed_error.workspace = true
simien_capacity_builder.workspace = true
simien_cache_dir.workspace = true
deno_config.workspace = true
simien_error.workspace = true
deno_graph.workspace = true
simien_lockfile.workspace = true
simien_npm.workspace = true
simien_npm_cache.workspace = true
simien_npmrc.workspace = true
simien_package_json.workspace = true
simien_path_util.workspace = true
deno_resolver = { workspace = true, features = ["graph", "sync"] }
simien_semver.workspace = true
simien_terminal.workspace = true
simien_unsync.workspace = true
futures.workspace = true
lazy-regex.workspace = true
libc.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
pathdiff.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_sys_traits = { workspace = true, features = ["getrandom", "real", "winapi", "libc"] }
thiserror.workspace = true
twox-hash.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
simien_sys_traits = { workspace = true, features = ["real", "wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simien_error = { workspace = true, features = ["serde", "serde_json", "tokio"] }
simien_unsync = { workspace = true, features = ["tokio"] }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["memory", "real", "serde_json"] }
test_util.workspace = true
