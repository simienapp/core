[package]
name = "simien_npm"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "npm registry metadata and dependency resolution for Simien. Forked from deno_npm 0.71.0."
edition.workspace = true
license = "MIT"

[lib]
path = "./lib.rs"

[features]
default = ["simd"]
simd = []
tracing = []

[dependencies]
async-trait.workspace = true
bytemuck = { workspace = true, features = ["aarch64_simd", "avx512_simd", "must_cast"] }
simien_capacity_builder.workspace = true
chrono = { workspace = true, default-features = false, features = ["serde"] }
simien_error.workspace = true
simien_lockfile.workspace = true
simien_package_json.workspace = true
simien_semver.workspace = true
futures.workspace = true
indexmap.workspace = true
log.workspace = true
simien_monch.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
url.workspace = true
wide = "0.7.32"

[dev-dependencies]
divan = "0.1.17"
hex = "0.4.3"
paste.workspace = true
pretty_assertions.workspace = true
reqwest.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "registry_json"
harness = false
