[package]
name = "simien_wasm_dep_analyzer"
version = "0.1.1"
edition = "2021"
description = "Wasm module dependency analysis for module resolution. Forked from Deno's simien_wasm_dep_analyzer 0.4.0."
repository = "https://github.com/simienapp/core"
documentation = "https://docs.rs/wasm_dep_analyzer"
authors = ["the Deno authors", "the Simien authors"]
license = "MIT"

[dependencies]
thiserror = "2"
simien_error.workspace = true

[dev-dependencies]
pretty_assertions = "1.0.0"
