[package]
name = "simien_node_resolver"
version = "0.97.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Node.js module resolution algorithm used in Deno"

[lib]
path = "lib.rs"

[features]
graph = ["deno_graph"]
sync = ["simien_maybe_sync/sync", "simien_package_json/sync"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
simien_boxed_error.workspace = true
simien_capacity_builder.workspace = true
simien_error.workspace = true
deno_graph = { workspace = true, optional = true }
simien_maybe_sync.workspace = true
simien_media_type.workspace = true
simien_package_json.workspace = true
simien_path_util.workspace = true
simien_semver.workspace = true
futures.workspace = true
lazy-regex.workspace = true
log.workspace = true
once_cell.workspace = true
path-clean.workspace = true
percent-encoding.workspace = true
pretty_assertions.workspace = true
regex.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["memory"] }
