[package]
name = "simien_node_resolver"
version = "0.1.3"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "package.json exports/imports and condition resolution for Simien's module loader. Forked from node_resolver 0.97.0."
edition.workspace = true
license = "MIT"
readme = "README.md"

[lib]
path = "lib.rs"

[features]
sync = ["simien_maybe_sync/sync", "simien_package_json/sync"]
# The CommonJS analysis, for a translator and a loader to share.
oxc = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_parser", "dep:oxc_span"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
simien_boxed_error.workspace = true
simien_capacity_builder.workspace = true
simien_error.workspace = true
simien_maybe_sync.workspace = true
simien_media_type.workspace = true
simien_package_json.workspace = true
simien_path_util.workspace = true
simien_semver.workspace = true
futures.workspace = true
lazy-regex.workspace = true
log.workspace = true
once_cell.workspace = true
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
path-clean.workspace = true
percent-encoding.workspace = true
pretty_assertions.workspace = true
regex.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["memory"] }
