[package]
name = "simien_capacity_builder"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Builders that compute capacity before allocating, for Simien. Forked from capacity_builder 0.5.0."
edition = "2021"
license = "MIT"

[features]
ecow = ["dep:ecow"]
hipstr = ["dep:hipstr"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
simien_capacity_builder_macros.workspace = true
ecow = { version = "0.2", optional = true }
hipstr = { version = "0.6", optional = true }
itoa = "1.0.14"

[dev-dependencies]
divan = "0.1.17"

[[bench]]
name = "bench"
harness = false

