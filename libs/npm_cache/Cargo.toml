[package]
name = "simien_npm_cache"
version = "0.78.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Helpers for downloading and caching npm dependencies for Deno"

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
simien_cache_dir = { workspace = true, features = ["sync"] }
simien_error = { workspace = true, features = ["serde", "serde_json"] }
simien_npm.workspace = true
simien_npmrc.workspace = true
simien_path_util.workspace = true
simien_semver.workspace = true
simien_unsync.workspace = true
faster-hex.workspace = true
flate2 = { workspace = true, features = ["default"] }
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_sys_traits.workspace = true
tar.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simien_error = { workspace = true, features = ["serde", "serde_json", "tokio"] }
simien_unsync = { workspace = true, features = ["tokio"] }
aws-lc-rs.workspace = true
libdeflater.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
flate2 = { workspace = true, features = ["rust_backend"] }
sha2.workspace = true
sha1.workspace = true

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["memory", "real"] }
tempfile.workspace = true
