[package]
name = "simien_resolver"
version = "0.90.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Deno resolution algorithm"

[lib]
path = "lib.rs"

[features]
deno_ast = ["dep:deno_ast", "deno_graph/swc"]
graph = ["deno_graph", "simien_node_resolver/graph", "http", "deno_permissions"]
sync = [
  "dashmap",
  "simien_maybe_sync/sync",
  "simien_package_json/sync",
  "simien_node_resolver/sync",
  "deno_config/sync",
  "simien_cache_dir/sync",
]

[dependencies]
anyhow.workspace = true
async-once-cell.workspace = true
async-trait.workspace = true
simien_boxed_error.workspace = true
simien_capacity_builder.workspace = true
chrono.workspace = true
dashmap = { workspace = true, optional = true }
deno_ast = { workspace = true, features = ["cjs"], optional = true }
simien_cache_dir.workspace = true
deno_config.workspace = true
simien_error.workspace = true
deno_graph = { workspace = true, optional = true }
simien_lockfile.workspace = true
simien_maybe_sync.workspace = true
simien_media_type.workspace = true
simien_npm.workspace = true
simien_npmrc.workspace = true
simien_package_json.workspace = true
simien_path_util.workspace = true
deno_permissions = { workspace = true, optional = true }
simien_semver.workspace = true
simien_terminal.workspace = true
simien_unsync.workspace = true
futures.workspace = true
http = { workspace = true, optional = true }
imara-diff.workspace = true
import_map.workspace = true
indexmap.workspace = true
jsonc-parser.workspace = true
log.workspace = true
simien_node_resolver.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
phf = { workspace = true, features = ["macros"] }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true
twox-hash.workspace = true
url.workspace = true
yaml_parser.workspace = true

[dev-dependencies]
simien_node_resolver.workspace = true
simien_sys_traits = { workspace = true, features = ["memory", "real", "serde_json"] }
test_util.workspace = true
