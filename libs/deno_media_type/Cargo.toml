[package]
name = "simien_media_type"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Media types of JavaScript and TypeScript files, for Simien. Forked from deno_media_type 0.4.0."
edition = "2021"
license = "MIT"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["module_specifier"]
decoding = ["encoding_rs"]
data_url = ["dep:data-url", "url"]
module_specifier = ["dep:data-url", "url"]

[dependencies]
data-url = { version = "0.3.0", optional = true }
encoding_rs = { version = "0.8.33", optional = true }
serde = { version = "1.0.130", features = ["derive", "rc"] }
url = { version = "2.3.1", optional = true }

[dev-dependencies]
pretty_assertions = "1.0.0"
serde_json = { version = "1.0.67", features = ["preserve_order"] }
