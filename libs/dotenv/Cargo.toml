[package]
name = "simien_dotenv"
version = "0.1.0"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
repository = "https://github.com/simienapp/core"
description = ".env parsing for simien_node. Forked from deno_dotenv 0.28.0."

[dependencies]
simien_path_util.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
simien_sys_traits = { workspace = true, features = ["memory"] }

[lib]
path = "lib.rs"
