[package]
name = "simien_native_certs"
description = "Loads the native certificate store for simien_tls. Forked from Deno's simien_native_certs 0.3.1."
version = "0.1.1"
edition = "2021"
authors = ["the Deno authors", "the Simien authors"]
license = "MIT"
repository = "https://github.com/simienapp/core"

[[bin]]
name = "deno_native_certs_test"
path = "test_bin.rs"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-native-certs = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
once_cell = "1.19.0"
dlopen2 = "0.7.0"
dlopen2_derive = "0.4.0"
rustls-pemfile = "2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustls-native-certs = "0.7"
