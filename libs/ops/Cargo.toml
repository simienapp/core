[package]
name = "simien_ops"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/simienapp/core"
description = "Proc macros for writing simien_core ops. Forked from Deno's simien_ops 0.288.0."

[lib]
path = "./lib.rs"
