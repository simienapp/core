[package]
name = "simien_cache_dir"
version = "0.1.1"
authors = ["the Deno authors", "the Simien authors"]
repository = "https://github.com/simienapp/core"
description = "Cache directory layout for Simien. Forked from deno_cache_dir 0.51.0."
edition.workspace = true
license = "MIT"

[lib]
path = "./lib.rs"

[features]
default = ["file_fetcher"]
file_fetcher = ["async-trait", "base64", "chrono", "data-url", "http"]
sync = []

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
simien_boxed_error.workspace = true
# Note: Do not use the "clock" feature of chrono, as it links us to CoreFoundation on macOS.
chrono = { workspace = true, default-features = false, features = ["std"], optional = true }
data-url = { workspace = true, optional = true }
simien_error = { workspace = true, features = ["url"] }
simien_maybe_sync.workspace = true
simien_media_type.workspace = true
simien_path_util.workspace = true
http = { workspace = true, optional = true }
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
simien_sys_traits.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
pretty_assertions.workspace = true
simien_sys_traits = { workspace = true, features = ["memory", "real", "getrandom", "libc", "winapi"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
