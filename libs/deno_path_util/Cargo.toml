[package]
name = "simien_path_util"
description = "Path utilities used by simien_core. Forked from Deno's deno_path_util 0.6.4."
version = "0.1.2"
edition = "2024"
authors = ["the Deno authors", "the Simien authors"]
license = "MIT"
repository = "https://github.com/simienapp/core"

[features]

[dependencies]
percent-encoding = "2.3.0"
thiserror = "2"
simien_sys_traits.workspace = true
simien_error = { workspace = true, features = ["url"] }
url = "2.5.1"

[dev-dependencies]
pretty_assertions = "1.4.0"
simien_sys_traits = { workspace = true, features = ["getrandom", "memory", "real"] }
tempfile = "3.4.0"
divan = "0.1.21"

[[bench]]
name = "bench"
harness = false
