[package]
name = "simien_node_runtime"
version = "0.4.1"
authors = ["the Deno authors", "the Simien authors"]
edition.workspace = true
license.workspace = true
readme = "js/README.md"
repository = "https://github.com/simienapp/core"
description = "The Deno namespace simien_node reads, as a hidden global in isolates granted dangerouslyUseNode, with the ops behind it and the TypeScript transpiler its extensions need. Forked from deno_runtime 0.267.0's js/ and ops/."

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
futures.workspace = true
libc.workspace = true
log.workspace = true
notify.workspace = true
once_cell.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_codegen.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_transformer.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
simien_core.workspace = true
simien_error.workspace = true
simien_fetch.workspace = true
simien_fs.workspace = true
simien_io.workspace = true
simien_net.workspace = true
simien_node.workspace = true
simien_node_crypto.workspace = true
simien_node_resolver = { workspace = true, features = ["oxc"] }
simien_os.workspace = true
simien_path_util.workspace = true
simien_permissions.workspace = true
simien_process.workspace = true
simien_resolver.workspace = true
simien_maybe_sync.workspace = true
simien_napi.workspace = true
simien_sys_traits = { workspace = true, features = ["real", "libc", "winapi"] }
simien_terminal.workspace = true
simien_web.workspace = true
simien_webidl.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[build-dependencies]
simien_napi.workspace = true

[dev-dependencies]
simien_crypto.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
